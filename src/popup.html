<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MS365 Copilot Auto Model Selector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="header">
        <div>
          <p class="eyebrow">Microsoft 365 Copilot</p>
          <h1>Auto Model Selector</h1>
        </div>
      </header>

      <section id="behaviorSection" class="section" aria-label="Behavior settings">
        <label id="languageField" class="switch" data-help="">
          <span id="languageLabel" class="switch-text">Use Japanese UI</span>
          <input id="uiLanguage" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </label>

        <label id="enabledField" class="switch" data-help="">
          <span id="enabledLabel" class="switch-text">Enable automatic selection</span>
          <input id="enabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </section>

      <section id="modelSection" class="section" aria-label="Model settings">
        <label id="targetPathField" class="field" data-help="">
          <span id="targetPathLabel">Selection path</span>
          <input id="targetPath" type="text" autocomplete="off" placeholder="GPT, GPT 5.6 Think deeper">
        </label>
      </section>

      <section id="urlRulesSection" class="section" aria-label="URL-specific model settings">
        <div class="section-heading">
          <div>
            <h2 id="urlRulesTitle">URL rules</h2>
            <p id="urlRulesDescription">Rules are evaluated from top to bottom. Use Up/Down to reorder them.</p>
          </div>
          <button id="addUrlRule" type="button" data-help="">Add</button>
        </div>

        <div id="urlRules" class="rule-list" aria-label="URL rules"></div>
      </section>

      <aside class="help-panel" aria-live="polite">
        <span id="helpTitle">Description</span>
        <p id="helpText">Hover over an item to show its description.</p>
      </aside>

      <div class="actions">
        <button id="reset" type="button" data-help="">Reset to defaults</button>
      </div>

      <p id="status" role="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
